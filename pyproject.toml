[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-6dof-control-lab"
version = "0.1.0"
description = "Audited six-axis free-space MuJoCo control experiments"
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "mujoco==3.12.0", "compliant-control-core==0.5.1+7aec01379ff9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
